name: Build Debug APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unzip project
        run: |
          set -e
          echo "Files in repo:"
          ls -la
          ZIP=$(ls DualAudio*.zip DuelAudio*.zip 2>/dev/null | head -1 || true)
          if [ -z "$ZIP" ]; then
            ZIP=$(ls *.zip 2>/dev/null | head -1 || true)
          fi
          if [ -z "$ZIP" ]; then
            echo "ERROR: No zip file found"
            exit 1
          fi
          echo "Extracting: $ZIP"
          unzip -o "$ZIP"
          if [ -d DualAudioRouter ]; then
            cp -a DualAudioRouter/. .
            rm -rf DualAudioRouter
          fi
          rm -f "$ZIP"
          echo "After extract:"
          ls -la
          test -f settings.gradle.kts
          test -d app
          test -f app/build.gradle.kts

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK packages
        run: |
          set -e
          # Runner already has ANDROID_HOME and cmdline-tools
          echo "ANDROID_HOME=$ANDROID_HOME"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-31" "build-tools;34.0.0" "platform-tools"

      - name: Build Debug APK
        run: |
          set -e
          # Use the Gradle that comes with the project or install 8.2
          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew assembleDebug --stacktrace --no-daemon
          else
            # Install Gradle 8.2 if wrapper is missing
            curl -sL https://services.gradle.org/distributions/gradle-8.2-bin.zip -o /tmp/gradle.zip
            unzip -q /tmp/gradle.zip -d /opt
            export PATH="/opt/gradle-8.2/bin:$PATH"
            gradle --version
            gradle assembleDebug --stacktrace --no-daemon
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DualAudioRouter-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
