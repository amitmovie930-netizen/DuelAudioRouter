
name: Build Debug APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unzip project
        run: |
          set -e
          echo "Files in repo:"
          ls -la
          ZIP=$(ls DualAudio*.zip DuelAudio*.zip 2>/dev/null | head -1 || true)
          if [ -z "$ZIP" ]; then
            ZIP=$(ls *.zip 2>/dev/null | head -1 || true)
          fi
          if [ -z "$ZIP" ]; then
            echo "ERROR: No zip file found"
            exit 1
          fi
          echo "Extracting: $ZIP"
          unzip -o "$ZIP"
          if [ -d DualAudioRouter ]; then
            cp -a DualAudioRouter/. .
            rm -rf DualAudioRouter
          fi
          rm -f "$ZIP"
          echo "After extract:"
          ls -la
          test -f settings.gradle.kts
          test -d app
          test -f app/build.gradle.kts

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: |
          set -e
          sdkmanager "platforms;android-31" "build-tools;31.0.0" "platform-tools"
          yes | sdkmanager --licenses || true
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" || true

      - name: Build Debug APK
        run: |
          set -e
          if ! command -v gradle >/dev/null 2>&1; then
            curl -sL https://services.gradle.org/distributions/gradle-8.2-bin.zip -o /tmp/gradle.zip
            sudo unzip -q /tmp/gradle.zip -d /opt
            export PATH="/opt/gradle-8.2/bin:$PATH"
          fi
          gradle --version
          gradle assembleDebug --stacktrace --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DualAudioRouter-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
